#
# DirectKeycast
#

[appearance]
# 主题模式，可选："dark", "light", "system"
theme_mode = "dark"
# 按键浮层字体
font = "Cascadia Mono"
# 缺省字体（指定字体不存在时使用）
default_font = "Microsoft YaHei"
# 字体大小（px），可选：12–32
font_size = 24
# 彩虹文字（历史键帽使用不同颜色，最新按键使用黄色）
rainbow_text = false
# 键帽背景不透明度，范围 0.35–1.0
bg_opacity = 0.75
# 圆角半径，可选：8 / 12 / 16
corner_radius = 12.0
# 描边宽度，可选：0 / 1 / 2 / 3
border_thickness = 3.0

[overlay]
# 显示按键浮层
enabled = true
# 同时显示鼠标按键
show_mouse = true
# 无输入后自动隐藏（毫秒）
fade_ms = 1500
# 最多显示的按键排数，范围 1–5，当前排放满后向上滚动
rows = 1
# 浮层位置，可选："bottom-right", "bottom-left", "top-right", "top-left"
position = "bottom-right"
